[tool.poetry]
name = "s_media_analyzer"
version = "0.1.0"
description = "Анализатор фото/видео комплекса s_media: лица и геотеги (работает рядом с s_media_service)"
authors = ["Сергей Сушков <sushkov_sv@ursip.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.128.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "~2.0.36"
alembic = "^1.13.0"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
pgvector = "^0.3.6"
numpy = "^1.26.0"
pillow = "^10.2.0"
pillow-heif = "^0.16.0"
insightface = "^0.7.3"
onnxruntime = "^1.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
pytest-lazy-fixture = "^0.6.3"
pytest-faker = "^2.0.0"
faker = "^25.0.0"
httpx = "^0.27.0"
black = "^24.4.0"
flake8 = "^6.1.0"
flake8-print = "^5.0.0"
isort = "^5.13.0"
autoflake = "^2.3.0"
unify = "^0.5"
pylint = "^3.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
