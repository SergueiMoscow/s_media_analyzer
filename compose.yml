# s_media_analyzer — общий compose (для GitHub).
# Сервер-специфичные монтирования медиа-каталогов — в compose.override.yml
# (см. compose.override.example.yml). docker compose мержит оба файла.
# network_mode: host — анализатор работает рядом с s_media_service на одной
# машине и ходит в общую БД через localhost:5432.
services:
  analyzer-api:
    image: ghcr.io/sergueimoscow/s_media_analyzer:latest
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    command: bash -c 'while !</dev/tcp/localhost/5432; do sleep 1; done; alembic upgrade head && uvicorn api.app:app --host 0.0.0.0 --port 8000'
    volumes:
      - ./.env:/app/.env:ro
      - ./faces:/faces
    restart: always

  analyzer-worker:
    image: ghcr.io/sergueimoscow/s_media_analyzer:latest
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    command: python -m worker.main
    volumes:
      - ./.env:/app/.env:ro
      - ./faces:/faces
    restart: always
